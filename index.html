<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack Pro - Gestión de Clientes</title>
    <!-- Tailwind CSS para diseño responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS para mapas interactivos -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Lucide Icons para iconografía moderna -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        #map { height: 450px; border-radius: 0.75rem; z-index: 10; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .leaflet-popup-content-wrapper { border-radius: 0.5rem; padding: 5px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Cabecera de la Aplicación -->
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-indigo-700 flex items-center gap-2">
                    <i data-lucide="truck"></i> LogiTrack Pro
                </h1>
                <p class="text-slate-500">Sistema de geolocalización y gestión de contactos para logística</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportToExcel()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg transition shadow-sm font-medium">
                    <i data-lucide="download"></i> Exportar a Excel
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Columna Izquierda: Registro y Listado -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Formulario de Entrada -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                        <i data-lucide="user-plus" class="text-indigo-500"></i> Nuevo Registro
                    </h2>
                    <form id="clientForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Empresa / Cliente</label>
                            <input type="text" id="clientName" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nombre del negocio">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Contacto</label>
                                <input type="text" id="contactName" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nombre">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono</label>
                                <input type="tel" id="contactPhone" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Número">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Dirección</label>
                            <input type="text" id="address" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ciudad, Calle, Local">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Latitud</label>
                                <input type="number" step="any" id="lat" required class="w-full px-3 py-2 border border-slate-300 rounded-md bg-slate-50" placeholder="0.000000">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Longitud</label>
                                <input type="number" step="any" id="lng" required class="w-full px-3 py-2 border border-slate-300 rounded-md bg-slate-50" placeholder="0.000000">
                            </div>
                        </div>
                        <button type="button" onclick="getCurrentLocation()" class="w-full text-indigo-600 border border-indigo-600 py-2 rounded-md hover:bg-indigo-50 transition flex items-center justify-center gap-2 text-sm font-medium">
                            <i data-lucide="map-pin"></i> Obtener mi ubicación actual
                        </button>
                        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition font-bold shadow-md">
                            Guardar en Base de Datos
                        </button>
                    </form>
                </div>

                <!-- Lista de Clientes Guardados -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-semibold mb-4 text-slate-800">Clientes Registrados</h2>
                    <div id="clientList" class="space-y-3 max-h-80 overflow-y-auto custom-scrollbar pr-2">
                        <!-- Contenido dinámico -->
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Mapa Interactivo -->
            <div class="lg:col-span-2">
                <div class="bg-white p-2 rounded-xl shadow-sm border border-slate-200">
                    <div id="map"></div>
                    <div class="p-4 bg-slate-50 rounded-b-lg border-t border-slate-100 flex justify-between items-center">
                        <div class="text-xs text-slate-500 flex items-center gap-1">
                            <i data-lucide="info" size="14"></i> 
                            Puedes hacer clic en el mapa para capturar la posición exacta.
                        </div>
                        <button onclick="clearAllData()" class="text-xs text-red-400 hover:text-red-600 transition underline font-medium">
                            Limpiar todos los datos
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Librerías Externas -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <script>
        lucide.createIcons();

        // Estado y Persistencia
        let clients = JSON.parse(localStorage.getItem('logi_clients_v2')) || [];
        let map, markersGroup;

        // Inicializar Aplicación
        function initApp() {
            // Mapa inicial (Vista mundial/país)
            map = L.map('map').setView([0, 0], 2);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);

            // Captura de coordenadas al hacer clic
            map.on('click', (e) => {
                document.getElementById('lat').value = e.latlng.lat.toFixed(6);
                document.getElementById('lng').value = e.latlng.lng.toFixed(6);
            });

            renderUI();
        }

        // Obtener Ubicación GPS Real
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        document.getElementById('lat').value = latitude.toFixed(6);
                        document.getElementById('lng').value = longitude.toFixed(6);
                        map.setView([latitude, longitude], 15);
                    },
                    () => showToast("No se pudo obtener la ubicación GPS", "error")
                );
            } else {
                showToast("Geolocalización no soportada en este navegador", "error");
            }
        }

        // Guardar Nuevo Cliente
        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newClient = {
                id: Date.now(),
                name: document.getElementById('clientName').value,
                contactName: document.getElementById('contactName').value,
                contactPhone: document.getElementById('contactPhone').value,
                address: document.getElementById('address').value,
                lat: parseFloat(document.getElementById('lat').value),
                lng: parseFloat(document.getElementById('lng').value),
                date: new Date().toLocaleString()
            };

            clients.push(newClient);
            syncData();
            this.reset();
            showToast("Registro guardado con éxito", "success");
        });

        // Eliminar Registro
        function deleteClient(id) {
            if(confirm("¿Eliminar este cliente de la lista?")) {
                clients = clients.filter(c => c.id !== id);
                syncData();
            }
        }

        // Borrado Total
        function clearAllData() {
            if(confirm("¿Estás seguro de que deseas borrar TODA la base de datos local?")) {
                clients = [];
                syncData();
            }
        }

        // Sincronizar LocalStorage y UI
        function syncData() {
            localStorage.setItem('logi_clients_v2', JSON.stringify(clients));
            renderUI();
        }

        // Dibujar Mapa y Lista
        function renderUI() {
            const list = document.getElementById('clientList');
            list.innerHTML = '';
            markersGroup.clearLayers();

            if (clients.length === 0) {
                list.innerHTML = '<p class="text-slate-400 text-center py-4 italic text-sm">No hay clientes registrados aún.</p>';
                return;
            }

            clients.forEach(c => {
                // Agregar Marcador al Mapa
                L.marker([c.lat, c.lng])
                    .bindPopup(`
                        <div class="text-sm">
                            <b class="text-indigo-700">${c.name}</b><br>
                            <b>Tel:</b> ${c.contactPhone}<br>
                            <span class="text-slate-500">${c.address}</span>
                        </div>
                    `)
                    .addTo(markersGroup);

                // Crear tarjeta en lista lateral
                const item = document.createElement('div');
                item.className = "p-3 border border-slate-100 rounded-lg bg-slate-50 hover:bg-white hover:shadow-md transition relative group";
                item.innerHTML = `
                    <div class="cursor-pointer pr-6" onclick="map.setView([${c.lat}, ${c.lng}], 16)">
                        <h3 class="font-bold text-slate-800 text-sm truncate">${c.name}</h3>
                        <p class="text-[11px] text-slate-600 flex items-center gap-1 mt-1 font-medium">
                            <i data-lucide="phone" size="10"></i> ${c.contactPhone}
                        </p>
                        <p class="text-[10px] text-slate-400 mt-1 truncate italic">${c.address}</p>
                    </div>
                    <button onclick="deleteClient(${c.id})" class="absolute top-3 right-3 text-slate-300 hover:text-red-500 transition">
                        <i data-lucide="trash-2" size="14"></i>
                    </button>
                `;
                list.appendChild(item);
            });
            
            lucide.createIcons();
            
            // Ajustar mapa para ver todos los puntos
            if (clients.length > 0) {
                const group = new L.featureGroup(markersGroup.getLayers());
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        // Exportar a Excel (.xlsx)
        function exportToExcel() {
            if (clients.length === 0) {
                showToast("No hay datos para exportar", "error");
                return;
            }

            const excelRows = clients.map(c => ({
                "Nombre Empresa": c.name,
                "Contacto": c.contactName,
                "Teléfono": c.contactPhone,
                "Dirección": c.address,
                "Latitud": c.lat,
                "Longitud": c.lng,
                "Fecha Registro": c.date
            }));

            const ws = XLSX.utils.json_to_sheet(excelRows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "ClientesLogistica");
            
            // Descargar el archivo
            const fileName = `Ruta_Logistica_${new Date().toISOString().split('T')[0]}.xlsx`;
            XLSX.writeFile(wb, fileName);
            showToast("Excel generado y descargado", "success");
        }

        // Sistema de Notificaciones
        function showToast(text, type) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-white shadow-2xl transition-all duration-300 z-[3000] font-medium scale-90 opacity-0 ${type === 'success' ? 'bg-indigo-600' : 'bg-red-500'}`;
            toast.innerText = text;
            document.body.appendChild(toast);
            
            // Animación de entrada
            setTimeout(() => {
                toast.classList.remove('scale-90', 'opacity-0');
                toast.classList.add('scale-100', 'opacity-100');
            }, 10);

            // Desvanecer después de 3 segundos
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        window.onload = initApp;
    </script>
</body>
</html>
